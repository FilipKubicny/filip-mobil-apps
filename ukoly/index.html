<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Úkoly</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Úkoly">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Úkoly</h1>
<div class="card">
  <div class="field"><label for="add">Nový úkol</label><textarea id="add" style="min-height:70px" placeholder="Napiš úkol (víc úkolů = víc řádků)"></textarea></div>
  <button class="primary" id="addBtn" style="min-height:50px">Přidat</button>
</div>
<h2>Seznam</h2>
<div class="card" id="list"></div>
<div class="card">
  <div class="field"><label for="notes">Poznámky</label><textarea id="notes" placeholder="Cokoliv dalšího ke dni"></textarea><div class="warn" id="notesWarn" hidden></div></div>
</div>
<button class="primary" id="send">Odeslat</button>
<p class="muted" style="text-align:center" id="pending"></p>
<div class="actions"><button class="secondary" id="clearDone">Vymazat hotové</button><button class="secondary" id="resend">Odeslat znovu poslední</button></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
